[project]
name = "paperwork-ai-backend"
version = "0.1.0"
description = "AI paperwork automation: invoices, receipts and forms in, validated structured data out. FastAPI backend."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic",
    "fastapi",
    "openai",
    "openpyxl",
    "pillow",
    "pydantic",
    "pydantic-settings",
    "pypdf",
    "pypdfium2",
    "python-multipart",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "fpdf2",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "RUF001"]  # RUF001: "×" in messages is intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"sample/**" = ["ANN", "E501"]
